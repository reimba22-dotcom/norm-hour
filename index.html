<!DOCTYPE html>
<!-- M-Telemetry 2.0 (Figma Design System Edition) -->
<html lang="ru" data-theme="dark" data-drive="sport">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M-Telemetry">
<meta name="theme-color" content="#07090F">
<link rel="manifest" href="./manifest.webmanifest">
<title>Нормо-часы — M-Telemetry 2.0</title>
<style>
  :root {
    --bg: #07090F;
    --bg-mesh: radial-gradient(at 10% 0%, rgba(10, 132, 255, 0.16) 0px, transparent 50%),
               radial-gradient(at 90% 10%, rgba(226, 39, 24, 0.12) 0px, transparent 45%),
               radial-gradient(at 50% 95%, rgba(16, 185, 129, 0.10) 0px, transparent 55%);
    --surface: rgba(15, 21, 35, 0.85);
    --surface-elevated: #101624;
    --surface-card: #101624;
    --surface-input: rgba(0, 0, 0, 0.35);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    
    /* BMW M Heritage Palette */
    --m-blue: #00A0E3;
    --m-dark-blue: #1D4ED8;
    --m-red: #E22718;
    --accent: #38BDF8;
    --accent-blue: #0A84FF;
    --gold: #F59E0B;
    --green: #10B981;
    --red: #F43F5E;
    
    --shadow-card: 0 16px 36px -12px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    --shadow-float: 0 24px 52px -12px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.1);
    --radius-2xl: 28px;
    --radius-xl: 22px;
    --radius-lg: 18px;
    --radius-md: 12px;
    --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --safe-top: env(safe-area-inset-top, 14px);
    --safe-bottom: env(safe-area-inset-bottom, 14px);
  }

  [data-theme="light"] {
    --bg: #F1F5F9;
    --bg-mesh: radial-gradient(at 10% 0%, rgba(2, 132, 199, 0.12) 0px, transparent 50%),
               radial-gradient(at 90% 10%, rgba(226, 39, 24, 0.08) 0px, transparent 45%);
    --surface: rgba(255, 255, 255, 0.90);
    --surface-elevated: #FFFFFF;
    --surface-card: #FFFFFF;
    --surface-input: rgba(15, 23, 42, 0.05);
    --border: rgba(15, 23, 42, 0.08);
    --border-strong: rgba(15, 23, 42, 0.14);
    --text: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --shadow-card: 0 12px 30px -8px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  html, body {
    background-color: var(--bg);
    background-image: var(--bg-mesh);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* M-Stripe Ribbon */
  .m-stripe {
    display: inline-block;
    height: 4px;
    width: 36px;
    border-radius: 2px;
    background: linear-gradient(90deg, #00A0E3 0%, #00A0E3 33.3%, #1D4ED8 33.3%, #1D4ED8 66.6%, #E22718 66.6%, #E22718 100%);
    vertical-align: middle;
  }

  /* App Shell */
  .app-shell {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: calc(var(--safe-top) + 10px) 16px calc(var(--safe-bottom) + 100px);
  }

  @media (min-width: 860px) {
    .app-shell { max-width: 600px; padding-top: 24px; }
  }

  /* Top Status / Drive Mode Bar */
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    font-weight: 600;
  }
  .m-drive-pill {
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.05em;
    background: rgba(10, 132, 255, 0.16);
    border: 1px solid rgba(10, 132, 255, 0.4);
    color: var(--accent);
    cursor: pointer;
    transition: transform 0.16s var(--ease-spring);
  }
  .m-drive-pill:active { transform: scale(0.92); }

  /* Header */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .header-eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }
  .header-title-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }
  .header-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .icon-circle-btn {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: var(--surface-card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow-card);
    transition: transform 0.16s var(--ease-spring);
  }
  .icon-circle-btn:active { transform: scale(0.92); }

  /* Hero Telemetry Card */
  .hero-card {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
  }
  .hero-card::after {
    content: '';
    position: absolute;
    right: -40px; bottom: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(10, 132, 255, 0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Segmented Period Tabs */
  .seg-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 3px;
    margin-bottom: 14px;
  }
  .seg-bar.three { grid-template-columns: repeat(3, 1fr); }
  [data-theme="light"] .seg-bar { background: rgba(15, 23, 42, 0.06); }
  .seg-btn {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 2px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s var(--ease-spring);
  }
  .seg-btn.active {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }
  [data-theme="light"] .seg-btn.active {
    background: #FFFFFF;
    color: #0F172A;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
  }

  .nav-date-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 18px;
    width: 32px; height: 32px;
    cursor: pointer;
    border-radius: 8px;
  }
  .nav-btn:active { background: rgba(255,255,255,0.06); }

  .hero-top-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .hero-big-money {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1.1;
    margin-bottom: 4px;
    color: var(--text);
  }
  .hero-sub-text {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
    margin-bottom: 14px;
  }

  /* Sub Tiles */
  .hero-tiles-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .hero-tile {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 10px;
  }
  .hero-tile.active-blue {
    background: rgba(10, 132, 255, 0.14);
    border-color: rgba(10, 132, 255, 0.35);
  }
  .hero-tile-label { font-size: 9px; font-weight: 800; color: var(--text-secondary); letter-spacing: 0.06em; }
  .hero-tile-val { font-size: 16px; font-weight: 800; margin-top: 2px; color: var(--text); }
  .hero-tile.active-blue .hero-tile-val { color: var(--accent); }

  /* M-Shift Lights */
  .shift-box {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
  }
  .shift-hdr {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    font-weight: 800;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .shift-leds {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 4px;
    height: 7px;
  }
  .shift-led {
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.08);
  }
  .shift-led.lit-cyan { background: #00A0E3; box-shadow: 0 0 6px #00A0E3; }
  .shift-led.lit-blue { background: #1D4ED8; box-shadow: 0 0 6px #1D4ED8; }
  .shift-led.lit-gold { background: #F59E0B; box-shadow: 0 0 6px #F59E0B; }
  .shift-led.lit-red  { background: #E22718; box-shadow: 0 0 8px #E22718; }

  /* Main Action Bar */
  .action-bar {
    display: grid;
    grid-template-columns: 1fr 50px;
    gap: 10px;
    margin-bottom: 16px;
  }
  .btn-primary-action {
    background: linear-gradient(135deg, #0A84FF 0%, #0060DF 100%);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-lg);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 8px 24px -4px rgba(10, 132, 255, 0.5);
    transition: transform 0.16s var(--ease-spring);
  }
  .btn-primary-action:active { transform: scale(0.97); }
  .btn-icon-sq {
    height: 50px;
    border-radius: var(--radius-lg);
    background: var(--surface-card);
    border: 1px solid var(--border);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow-card);
    transition: transform 0.16s var(--ease-spring);
  }
  .btn-icon-sq:active { transform: scale(0.92); }

  /* Feed Header */
  .feed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 16px 2px 8px;
    font-size: 12px;
    font-weight: 800;
  }
  .feed-title { color: var(--text-secondary); letter-spacing: 0.05em; }
  .feed-total { color: var(--green); }

  /* Order Card */
  .order-card {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-card);
    transition: transform 0.16s var(--ease-spring);
  }
  .order-card:active { transform: scale(0.985); }
  .order-card.draft { border-left: 3px solid var(--gold); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .car-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
  }
  .car-meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }
  .ru-plate {
    background: #FFFFFF;
    color: #111;
    font-weight: 800;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: -apple-system, monospace;
    letter-spacing: 0.05em;
  }
  .order-num-pill {
    background: rgba(56, 189, 248, 0.12);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .card-price-block {
    text-align: right;
  }
  .card-price {
    font-size: 16px;
    font-weight: 900;
    color: var(--green);
  }
  .card-aw-sub {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
  }
  .card-jobs-text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.4;
    margin-top: 4px;
  }
  .card-bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .card-btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .card-btn:active { transform: scale(0.92); }
  .card-btn.danger { color: var(--red); border-color: rgba(244, 63, 94, 0.3); }

  /* Floating Bottom Nav Dock */
  .bottom-dock {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 10px);
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 28px);
    max-width: 440px;
    height: 64px;
    border-radius: 24px;
    background: rgba(12, 16, 28, 0.94);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 48px -10px rgba(0, 0, 0, 0.8);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    padding: 0 4px;
    z-index: 100;
  }
  [data-theme="light"] .bottom-dock {
    background: rgba(255, 255, 255, 0.94);
    border-color: rgba(15, 23, 42, 0.12);
  }
  .dock-item {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.18s, transform 0.14s;
  }
  .dock-item:active { transform: scale(0.88); }
  .dock-item.active { color: var(--accent); }
  [data-theme="light"] .dock-item.active { color: #0A84FF; }
  .dock-item-lbl { font-size: 10px; font-weight: 800; }

  /* Sheet Modal */
  .sheet-backdrop {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(12px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s var(--ease-spring);
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet-panel {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: var(--surface-card);
    border: 1px solid var(--border-strong);
    border-bottom: none;
    border-radius: 28px 28px 0 0;
    padding: 14px 18px calc(var(--safe-bottom) + 20px);
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.32s var(--ease-spring);
  }
  .sheet-backdrop.open .sheet-panel { transform: translateY(0); }
  .sheet-grabber {
    width: 38px;
    height: 4px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 auto 12px;
  }

  .preset-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  .preset-chip {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
  }
  .preset-chip:active { transform: scale(0.92); border-color: var(--accent); }

  /* Form Elements */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .field-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field-lbl {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }
  .field-inp {
    background: var(--surface-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .field-inp:focus { border-color: var(--accent); }

  .summary-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(10, 132, 255, 0.12);
    border: 1px solid rgba(10, 132, 255, 0.3);
    margin: 12px 0;
  }

  /* Calendar */
  .cal-table {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .cal-dow {
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
    padding-bottom: 4px;
  }
  .cal-cell {
    height: 60px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 5px 3px;
    cursor: pointer;
    transition: all 0.16s;
  }
  .cal-cell:active { transform: scale(0.92); }
  .cal-cell.work { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.35); }
  .cal-cell.selected { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .cal-cell-num { font-size: 12px; font-weight: 800; text-align: right; padding-right: 2px; }
  .cal-cell-m { font-size: 9px; font-weight: 800; color: var(--green); text-align: center; }
  .cal-cell-tag { font-size: 9px; font-weight: 800; color: var(--text-secondary); text-align: center; }

  /* Toast */
  .toast {
    position: fixed;
    top: calc(var(--safe-top) + 12px);
    left: 50%;
    transform: translate(-50%, -80px);
    background: rgba(15, 21, 35, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-strong);
    color: #F8FAFC;
    padding: 9px 18px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
    z-index: 300;
    pointer-events: none;
    transition: transform 0.3s var(--ease-spring), opacity 0.3s;
    opacity: 0;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="toast" class="toast">Готово</div>

<!-- Hidden inputs for photos -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galleryInput" accept="image/*" class="hidden">
<input type="file" id="jsonFileInput" accept=".json,application/json" class="hidden">

<div class="app-shell">
  <!-- Status & Drive Mode Row -->
  <div class="status-row">
    <div id="pwaStatus" style="font-size:11px;font-weight:800;color:var(--green);display:flex;align-items:center;gap:4px;">
      ● IndexedDB Active
    </div>
    <div class="m-drive-pill" id="driveModeBtn" onclick="cycleDriveMode()">
      SPORT+ · M1
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div>
      <div class="header-eyebrow">M-TELEMETRY COCKPIT</div>
      <div class="header-title-box">
        <h1 class="header-title" id="pageTitle">Заказ-наряды</h1>
        <span class="m-stripe"></span>
      </div>
    </div>
    <div class="header-actions">
      <div class="icon-circle-btn" onclick="openOrderModal()" title="Добавить">+</div>
      <div class="icon-circle-btn" onclick="triggerPhoto('camera')" title="Камера">📷</div>
    </div>
  </header>

  <!-- View Container -->
  <main id="mainView"></main>
</div>

<!-- Floating Bottom Nav Bar -->
<nav class="bottom-dock">
  <button class="dock-item active" data-tab="orders">
    <span style="font-size:18px;">📋</span>
    <span class="dock-item-lbl">Заказы</span>
  </button>
  <button class="dock-item" data-tab="schedule">
    <span style="font-size:18px;">📅</span>
    <span class="dock-item-lbl">График</span>
  </button>

<script src="./db.js"></script>
<script>
(function() {
  'use strict';

  function haptic(ms = 15) {
    if (navigator.vibrate) {
      try { navigator.vibrate(ms); } catch (e) {}
    }
  }

  // Service Worker
  if ('serviceWorker' in navigator && (window.location.protocol.startsWith('http') || window.location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  function updateNetworkStatus() {
    const el = document.getElementById('pwaStatus');
    if (!el) return;
    if (navigator.onLine) {
      el.textContent = '● IndexedDB Active';
      el.style.color = 'var(--green)';
    } else {
      el.textContent = 'Офлайн (IndexedDB)';
      el.style.color = 'var(--gold)';
    }
  }
  window.addEventListener('online', updateNetworkStatus);
  window.addEventListener('offline', updateNetworkStatus);
  updateNetworkStatus();

  let state = {
    orders: [],
    days: {},
    settings: {
      monthlySalaryKop: 8000000, // 80 000 руб
      hourRateKop: 100000,      // 1 000 руб / н/ч
      awPerHour100: 1200,       // 12 AW
      schedule: { type: "custom", pattern: "РРВВ" },
      theme: "dark",
      driveMode: "sport",
      ocrSpaceKey: "",
      geminiKey: ""
    }
  };

  let currentTab = 'orders';
  let periodMode = 'month';
  let anchorDate = new Date().toISOString().slice(0, 10);
  let customFrom = anchorDate.slice(0, 7) + '-01';
  let customTo = anchorDate;
  let calSubView = 'month';
  let selectedCalDay = anchorDate;
  let activePhotoDataUrl = null;

  function toLocalIso(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function parseLocalIso(iso) {
    const [y, m, d] = (iso || '').split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  }
  function addDaysIso(iso, delta) {
    const d = parseLocalIso(iso);
    d.setDate(d.getDate() + delta);
    return toLocalIso(d);
  }
  function addMonthsIso(iso, delta) {
    const [y, m, day] = iso.split('-').map(Number);
    const target = new Date(y, m - 1 + delta, 1);
    const maxD = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(day, maxD));
    return toLocalIso(target);
  }

  function uid() { return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
  function fmtRub(kop) { return Math.round((kop || 0) / 100).toLocaleString('ru-RU') + ' ₽'; }
  function fmtRubDec(kop) {
    return ((kop || 0) / 100).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
  }
  function fmtDateRu(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return `${parseInt(d, 10)} ${months[parseInt(m, 10) - 1]} ${y}`;
  }
  function fmtMonthTitle(ym) {
    const [y, m] = ym.split('-').map(Number);
    const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    return names[m - 1] + ' ' + y;
  }

  function toast(text) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(window._tTimer);
    window._tTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function calcOrderMetrics(aw100) {
    const awPerHour = (state.settings.awPerHour100 || 1200) / 100;
    const aw = aw100 / 100;
    const hours = aw / awPerHour;
    const hours100 = Math.round(hours * 100);
    const earningsKop = Math.round(hours * (state.settings.hourRateKop || 0));
    return { aw, hours, hours100, earningsKop };
  }

  function getActiveRange() {
    const nowIso = toLocalIso(new Date());
    if (periodMode === 'day') {
      return { start: anchorDate, end: anchorDate, label: anchorDate === nowIso ? 'Сегодня' : fmtDateRu(anchorDate) };
    }
    if (periodMode === 'week') {
      const d = parseLocalIso(anchorDate);
      const day = (d.getDay() + 6) % 7;
      const mon = new Date(d); mon.setDate(d.getDate() - day);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const s = toLocalIso(mon);
      const e = toLocalIso(sun);
      return { start: s, end: e, label: `${s.slice(8)}.${s.slice(5,7)} — ${e.slice(8)}.${e.slice(5,7)}` };
    }
    if (periodMode === 'custom') {
      const s = customFrom <= customTo ? customFrom : customTo;
      const e = customFrom <= customTo ? customTo : customFrom;
      return { start: s, end: e, label: `${s.slice(8)}.${s.slice(5,7)} — ${e.slice(8)}.${e.slice(5,7)}` };
    }
    const ym = anchorDate.slice(0, 7);
    const [y, m] = ym.split('-').map(Number);
    const lastD = new Date(y, m, 0).getDate();
    return { start: `${ym}-01`, end: `${ym}-${String(lastD).padStart(2, '0')}`, label: fmtMonthTitle(ym) };
  }

  function calcSalaryForRange(start, end) {
    let totalSalaryKop = 0;
    const cur = parseLocalIso(start);
    const last = parseLocalIso(end);
    while (cur <= last) {
      const iso = toLocalIso(cur);
      const ym = iso.slice(0, 7);
      const st = state.days[iso];
      if (st === 'work' || st === 'vacation') {
        const monthWorkDays = Object.entries(state.days).filter(([k, v]) => k.startsWith(ym) && (v === 'work' || v === 'vacation')).length || 15;
        totalSalaryKop += (state.settings.monthlySalaryKop || 0) / monthWorkDays;
      }
      cur.setDate(cur.getDate() + 1);
    }
    return Math.round(totalSalaryKop);
  }

  function applyTheme() {
    const t = state.settings.theme || 'dark';
    const dm = state.settings.driveMode || 'sport';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-drive', dm);
    const mBtn = document.getElementById('driveModeBtn');
    if (mBtn) {
      mBtn.textContent = dm === 'sport' ? 'SPORT+ · M1' : dm === 'mcs' ? 'M CS · TRACK' : 'COMFORT';
    }
  }

  async function initDatabaseAndState() {
    try {
      await window.MDB.migrateLegacyData();
      const loadedOrders = await window.MDB.getAllOrders();
      const loadedDays = await window.MDB.getDays();
      const loadedSettings = await window.MDB.getSettings();

      state.orders = loadedOrders || [];
      state.days = loadedDays || {};
      if (loadedSettings) {
        state.settings = Object.assign({}, state.settings, loadedSettings);
      }

      // Add demo sample orders if completely empty
      if (state.orders.length === 0) {
        state.orders = [
          {
            id: uid(),
            number: "7812450",
            brand: "BMW",
            model: "X5 xDrive40i G05",
            plate: "А 777 АА 777",
            date: anchorDate,
            jobs: [
              { id: uid(), title: "Замена моторного масла и фильтра", aw100: 400 },
              { id: uid(), title: "Замена передних тормозных колодок", aw100: 800 },
              { id: uid(), title: "Сход-развал", aw100: 800 }
            ],
            aw100: 2000,
            hours100: 167,
            earningsKop: 1666700,
            status: "confirmed"
          },
          {
            id: uid(),
            number: "7812451",
            brand: "BMW",
            model: "M3 Competition G80",
            plate: "М 003 ММ 777",
            date: anchorDate,
            jobs: [
              { id: uid(), title: "Диагностика DDE", aw100: 300 },
              { id: uid(), title: "Замена свечей зажигания", aw100: 300 }
            ],
            aw100: 600,
            hours100: 50,
            earningsKop: 500000,
            status: "confirmed"
          }
        ];
        for (const ord of state.orders) {
          await window.MDB.saveOrder(ord);
        }
      }

      applyTheme();
      render();
    } catch (e) {
      render();
    }
  }

  // Navigation
  const TAB_TITLES = { orders: 'Заказ-наряды', schedule: 'График смен', stats: 'Телеметрия', history: 'Архив', settings: 'Опции' };

  document.querySelectorAll('.dock-item').forEach(btn => {
    btn.onclick = () => {
      haptic(12);
      const next = btn.dataset.tab;
      if (next === currentTab) return;
      document.querySelectorAll('.dock-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = next;
      render();
    };
  });

  window.setPeriodMode = (mode) => { haptic(10); periodMode = mode; render(); };
  window.shiftPeriod = (dir) => {
    haptic(10);
    if (periodMode === 'day') anchorDate = addDaysIso(anchorDate, dir);
    else if (periodMode === 'week') anchorDate = addDaysIso(anchorDate, dir * 7);
    else anchorDate = addMonthsIso(anchorDate, dir);
    selectedCalDay = anchorDate;
    render();
  };

  function renderPeriodSwitcherHtml() {
    const r = getActiveRange();
    return `
      <div class="seg-bar">
        <button class="seg-btn ${periodMode==='day'?'active':''}" onclick="setPeriodMode('day')">День</button>
        <button class="seg-btn ${periodMode==='week'?'active':''}" onclick="setPeriodMode('week')">Неделя</button>
        <button class="seg-btn ${periodMode==='month'?'active':''}" onclick="setPeriodMode('month')">Месяц</button>
        <button class="seg-btn ${periodMode==='custom'?'active':''}" onclick="setPeriodMode('custom')">Период</button>
      </div>
      <div class="nav-date-row">
        <button class="nav-btn" onclick="shiftPeriod(-1)">‹</button>
        <span>${r.label}</span>
        <button class="nav-btn" onclick="shiftPeriod(1)">›</button>
      </div>
    `;
  }

  // 1. ORDERS TAB (Matching Screen 01 from Figma)
  function renderOrders(container) {
    const r = getActiveRange();
    const rangeOrders = state.orders
      .filter(o => o.date >= r.start && o.date <= r.end)
      .sort((a, b) => b.date.localeCompare(a.date));

    const confirmed = rangeOrders.filter(o => o.status !== 'draft');
    const totalAw100 = confirmed.reduce((s, o) => s + (o.aw100 || 0), 0);
    const totalHours = (totalAw100 / 100) / ((state.settings.awPerHour100 || 1200) / 100);
    const pieceKop = confirmed.reduce((s, o) => s + (o.earningsKop || 0), 0);
    const salaryKop = calcSalaryForRange(r.start, r.end);
    const totalKop = pieceKop + salaryKop;

    const targetAw = periodMode === 'day' ? 120 : periodMode === 'week' ? 600 : 1800;
    const litCount = Math.min(12, Math.round(((totalAw100 / 100) / targetAw) * 12));
    let leds = '';
    for (let i = 0; i < 12; i++) {
      const col = i < 4 ? 'lit-cyan' : i < 7 ? 'lit-blue' : i < 10 ? 'lit-gold' : 'lit-red';
      const lit = i < litCount ? col : '';
      leds += `<span class="shift-led ${lit}"></span>`;
    }

    let html = `
      <section class="hero-card">
        ${renderPeriodSwitcherHtml()}
        <div class="hero-top-meta">
          <span>НОЯБРЬ 2026 · 16 ИЗ 20 СМЕН</span>
          <span style="color:var(--green);">+22% К ПЛАНУ</span>
        </div>
        <div class="hero-big-money num">${fmtRub(totalKop)}</div>
        <div class="hero-sub-text num">Оклад ${fmtRub(salaryKop)} + Выработка ${fmtRub(pieceKop)} (${(totalAw100 / 100).toFixed(0)} AW)</div>

        <div class="hero-tiles-grid">
          <div class="hero-tile active-blue">
            <div class="hero-tile-label">ВЫРАБОТКА AW</div>
            <div class="hero-tile-val num">${(totalAw100 / 100).toFixed(0)} AW</div>
          </div>
          <div class="hero-tile">
            <div class="hero-tile-label">НОРМО-ЧАСЫ</div>
            <div class="hero-tile-val num">${totalHours.toFixed(1).replace('.', ',')} н/ч</div>
          </div>
          <div class="hero-tile">
            <div class="hero-tile-label">ТЕМП СМЕНЫ</div>
            <div class="hero-tile-val num">${((totalAw100 / 100) / Math.max(1, rangeOrders.length)).toFixed(1)} AW/д</div>
          </div>
        </div>

        <div class="shift-box">
          <div class="shift-hdr">
            <span>M-SHIFT INDICATOR</span>
            <span class="num">${Math.min(100, Math.round(((totalAw100 / 100) / targetAw) * 100))}% ВЫПОЛНЕНО</span>
          </div>
          <div class="shift-leds">${leds}</div>
        </div>
      </section>

      <div class="action-bar">
        <button class="btn-primary-action" onclick="openOrderModal()">
          <span style="font-size:20px;line-height:1;">+</span> Новый заказ-наряд
        </button>
        <button class="btn-icon-sq" onclick="triggerPhoto('camera')" title="Камера OCR">📷</button>
      </div>

      <div class="feed-header">
        <span class="feed-title">СЕГОДНЯ · ${fmtDateRu(anchorDate).toUpperCase()}</span>
        <span class="feed-total num">${rangeOrders.length} З/Н · ${(totalAw100/100).toFixed(0)} AW · ${fmtRub(pieceKop)}</span>
      </div>
    `;

    if (!rangeOrders.length) {
      html += `<div style="text-align:center;padding:32px 12px;color:var(--text-secondary);font-size:14px;">Заказов за выбранный период нет</div>`;
    } else {
      rangeOrders.forEach(o => {
        const car = [o.brand, o.model].filter(Boolean).join(' ') || 'Заказ-наряд';
        const jobsStr = (o.jobs || []).map(j => `${j.title} (${j.aw100/100} AW)`).join('; ');
        html += `
          <article class="order-card ${o.status==='draft'?'draft':''}">
            <div class="card-top">
              <div>
                <div class="car-title">${escapeHtml(car)}</div>
                <div class="car-meta-row">
                  ${o.plate ? `<span class="ru-plate">${escapeHtml(o.plate)}</span>` : ''}
                  ${o.number ? `<span class="order-num-pill num">#${escapeHtml(o.number)}</span>` : ''}
                </div>
              </div>
              <div class="card-price-block">
                <div class="card-price num">${fmtRubDec(o.earningsKop)}</div>
                <div class="card-aw-sub num">${(o.aw100||0)/100} AW · ${((o.hours100||0)/100).toFixed(2)} н/ч</div>
              </div>
            </div>
            <div class="card-jobs-text">${escapeHtml(jobsStr)}</div>
            <div class="card-bottom-bar">
              <div>
                ${o.photoId ? `<button class="card-btn" style="color:var(--accent);" onclick="viewPhoto('${o.photoId}')">Фото З/Н</button>` : ''}
              </div>
              <div style="display:flex;gap:6px;">
                <button class="card-btn" onclick="editOrder('${o.id}')">Изменить</button>
                <button class="card-btn danger" onclick="deleteOrder('${o.id}')">✕</button>
              </div>
            </div>
          </article>
        `;
      });
    }

    container.innerHTML = html;
  }

  // 2. SCHEDULE TAB (Screen 03)
  function renderSchedule(container) {
    const ym = anchorDate.slice(0, 7);
    const [y, m] = ym.split('-').map(Number);
    const firstDay = new Date(y, m - 1, 1);
    const daysInMonth = new Date(y, m, 0).getDate();
    const startOffset = (firstDay.getDay() + 6) % 7;

    const monthOrders = state.orders.filter(o => o.date.startsWith(ym) && o.status !== 'draft');
    const monthAw100 = monthOrders.reduce((s, o) => s + (o.aw100 || 0), 0);
    const monthPieceKop = monthOrders.reduce((s, o) => s + (o.earningsKop || 0), 0);
    const totalMonthKop = (state.settings.monthlySalaryKop || 0) + monthPieceKop;

    let cellsHtml = '';
    for (let i = 0; i < startOffset; i++) cellsHtml += `<div></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${ym}-${String(d).padStart(2, '0')}`;

  function compressImage(file, maxW = 1280, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handlePhotoSelected(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    try {
      const dataUrl = await compressImage(file, 1280, 0.8);
      activePhotoDataUrl = dataUrl;
      document.getElementById('photoPreviewImg').src = dataUrl;
      document.getElementById('photoPreviewBox').classList.remove('hidden');

      const form = new FormData();
      form.append('base64Image', dataUrl);
      form.append('language', 'rus');
      form.append('OCREngine', '2');
      form.append('scale', 'true');

      const resp = await fetch('https://api.ocr.space/parse/image', {
        method: 'POST',
        headers: { 'apikey': state.settings.ocrSpaceKey || 'helloworld' },
        body: form
      });
      const json = await resp.json();
      const text = (json.ParsedResults || []).map(r => r.ParsedText || '').join('\n').trim();
      if (text) {
        const numM = text.match(/(?:Заказ-наряд|З\/Н)\s*(?:№|#|:)?\s*(\d{6,10})/i) || text.match(/\b(78\d{5,7})\b/);
        if (numM) document.getElementById('fNumber').value = numM[1];
        const plateM = text.match(/[АВЕКМНОРСТУХABEKMHOPCTYX]\s*\d{3}\s*[АВЕКМНОРСТУХABEKMHOPCTYX]{2}\s*\d{2,3}/i);
        if (plateM) document.getElementById('fPlate').value = plateM[0].replace(/\s+/g, '').toUpperCase();
        toast('Бланк распознан');
      }
    } catch (err) {
      toast('Фото прикреплено');
    }
  }

  document.getElementById('cameraInput').onchange = handlePhotoSelected;
  document.getElementById('galleryInput').onchange = handlePhotoSelected;

  window.cycleDriveMode = () => {
    haptic(15);
    const modes = ['comfort', 'sport', 'mcs'];
    const cur = state.settings.driveMode || 'sport';
    const next = modes[(modes.indexOf(cur) + 1) % modes.length];
    state.settings.driveMode = next;
    applyTheme();
    window.MDB.saveSettings(state.settings);
    toast(`M-Drive: ${next.toUpperCase()}`);
  };

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render() {
    document.getElementById('pageTitle').textContent = TAB_TITLES[currentTab] || 'Заказ-наряды';
    const main = document.getElementById('mainView');
    if (currentTab === 'orders') renderOrders(main);
    else if (currentTab === 'schedule') renderSchedule(main);
    else if (currentTab === 'stats') renderStats(main);
    else if (currentTab === 'history') renderHistory(main);
    else if (currentTab === 'settings') renderSettings(main);
  }

  initDatabaseAndState();
})();
</script>
</body>
</html>
